name: Deploy TradingBot

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_db_migration:
        description: "Load SQL dump into live DB (REPLACES current data; backup taken first)"
        type: boolean
        default: false
      force_rebuild:
        description: "Force rebuild both images even if no changes detected"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write   # required to push images to GHCR

concurrency:
  group: deploy-tradingbot-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Docker image repository names must be strictly lowercase
  BACKEND_IMAGE: ghcr.io/bharatha1303/tradingbot-backend
  FRONTEND_IMAGE: ghcr.io/bharatha1303/tradingbot-frontend

# ── Job 0: Detect changes ─────────────────────────────────────────────────────
jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.decide.outputs.backend }}
      frontend: ${{ steps.decide.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'docker-compose.tradingbot.yml'
              - '.github/workflows/deploy-tradingbot.yml'
            frontend:
              - 'frontend/**'
              - 'docker-compose.tradingbot.yml'
              - '.github/workflows/deploy-tradingbot.yml'

      - name: Decide build requirements
        id: decide
        run: |
          FORCE="${{ github.event.inputs.force_rebuild }}"
          if [ "${FORCE}" = "true" ] || [ "${{ github.event_name }}" != "push" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=${{ steps.filter.outputs.backend }}" >> "$GITHUB_OUTPUT"
            echo "frontend=${{ steps.filter.outputs.frontend }}" >> "$GITHUB_OUTPUT"
          fi

# ── Job 1a: Build & push backend ──────────────────────────────────────────────
  build-backend:
    name: Build Backend
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.tradingbot
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: |
            type=gha,scope=tradingbot-backend
            type=gha,scope=tradingbot-backend-main
          cache-to: type=gha,mode=max,scope=tradingbot-backend

# ── Job 1b: Build & push frontend (parallel with backend) ─────────────────────
  build-frontend:
    name: Build Frontend
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache node modules & build cache
        id: node-cache
        uses: actions/cache@v4
        with:
          path: |
            frontend/node_modules
            ~/.npm
          key: node-deps-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            node-deps-${{ runner.os }}-

      - name: Install dependencies
        if: steps.node-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build frontend assets
        working-directory: frontend
        env:
          VITE_API_URL: /api
        run: npm run build

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.tradingbot
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: |
            type=gha,scope=tradingbot-frontend
            type=gha,scope=tradingbot-frontend-main
          cache-to: type=gha,mode=max,scope=tradingbot-frontend

# ── Job 2: Deploy to AWS ───────────────────────────────────────────────────────
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: [changes, build-backend, build-frontend]
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    timeout-minutes: 15
    env:
      BACKEND_IMAGE:  ghcr.io/bharatha1303/tradingbot-backend
      FRONTEND_IMAGE: ghcr.io/bharatha1303/tradingbot-frontend
      GH_TOKEN:   ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}
      GH_ACTOR:   bharatha1303
      RUN_DB_MIGRATION: ${{ github.event.inputs.run_db_migration }}
      BUILD_BACKEND:  ${{ needs.changes.outputs.backend }}
      BUILD_FRONTEND: ${{ needs.changes.outputs.frontend }}
      TB_JWT_SECRET_KEY:        ${{ secrets.TB_JWT_SECRET_KEY }}
      TB_BROKER_ENCRYPTION_KEY: ${{ secrets.TB_BROKER_ENCRYPTION_KEY }}
      TB_POSTGRES_PASSWORD:     ${{ secrets.TB_POSTGRES_PASSWORD }}
      TB_GROQ_API_KEY:          ${{ secrets.TB_GROQ_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      # ── Start SSH agent (used for scp uploads) ─────────────────────────────
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.TB_SERVER_SSH_KEY }}

      # ── Upload config files to server ──────────────────────────────────────
      - name: Upload deploy assets to server
        env:
          SERVER_HOST: ${{ secrets.TB_SERVER_HOST }}
          SERVER_USER: ${{ secrets.TB_SERVER_USER }}
        run: |
          set -euo pipefail

          retry() {
            local attempts="$1" delay="$2"; shift 2
            local n=1
            until "$@"; do
              [ "$n" -ge "$attempts" ] && { echo "ERROR: failed after $attempts attempts: $*"; return 1; }
              echo "Attempt $n/$attempts failed — retrying in ${delay}s..."
              sleep "$delay"; n=$((n+1))
            done
          }

          SSH_OPTS=(
            -o StrictHostKeyChecking=accept-new
            -o UserKnownHostsFile=$HOME/.ssh/known_hosts
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=6
            -o ConnectTimeout=20
            -P 22
          )

          retry 4 5 ssh "${SSH_OPTS[@]}" "${SERVER_USER}@${SERVER_HOST}" \
            "sudo mkdir -p /opt/tradingbot/deploy/nginx && sudo chown -R ${SERVER_USER}:${SERVER_USER} /opt/tradingbot"

          retry 4 5 scp "${SSH_OPTS[@]}" \
            docker-compose.tradingbot.yml \
            "${SERVER_USER}@${SERVER_HOST}:/opt/tradingbot/docker-compose.tradingbot.yml"

          retry 4 5 scp "${SSH_OPTS[@]}" \
            deploy/nginx/tradingbot.conf \
            "${SERVER_USER}@${SERVER_HOST}:/opt/tradingbot/deploy/nginx/tradingbot.conf"

          # Upload DB migration assets only when explicitly triggered
          if [ "${RUN_DB_MIGRATION}" = "true" ]; then
            echo "run_db_migration=true — uploading dump + migration script"
            retry 4 5 scp "${SSH_OPTS[@]}" scripts/db_migrate.sh \
              "${SERVER_USER}@${SERVER_HOST}:/opt/tradingbot/scripts/db_migrate.sh"
            retry 4 5 scp "${SSH_OPTS[@]}" alphasync_demo.sql \
              "${SERVER_USER}@${SERVER_HOST}:/opt/tradingbot/tradingbot.sql"
          else
            echo "run_db_migration not set — skipping DB dump (data untouched)"
          fi

      # ── Deploy on server ───────────────────────────────────────────────────
      - name: Deploy on AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.TB_SERVER_HOST }}
          username: ${{ secrets.TB_SERVER_USER }}
          key:      ${{ secrets.TB_SERVER_SSH_KEY }}
          port:     22
          command_timeout: 10m
          envs: BACKEND_IMAGE,FRONTEND_IMAGE,GH_TOKEN,GH_ACTOR,RUN_DB_MIGRATION,BUILD_BACKEND,BUILD_FRONTEND,TB_JWT_SECRET_KEY,TB_BROKER_ENCRYPTION_KEY,TB_POSTGRES_PASSWORD,TB_GROQ_API_KEY
          script: |
            set -eo pipefail
            DEPLOY_DIR="/opt/tradingbot"

            retry() {
              local attempts="$1" delay="$2"; shift 2
              local n=1
              until "$@"; do
                [ "$n" -ge "$attempts" ] && { echo "ERROR: failed after $attempts attempts: $*"; return 1; }
                echo "Attempt $n/$attempts failed — retrying in ${delay}s..."
                sleep "$delay"; n=$((n+1))
              done
            }

            echo "=== Preparing deploy directory ==="
            mkdir -p "${DEPLOY_DIR}"
            cd "${DEPLOY_DIR}"

            # Write .env from secrets (never committed to repo)
            printf "%s\n" \
              "TB_JWT_SECRET_KEY=${TB_JWT_SECRET_KEY}" \
              "TB_BROKER_ENCRYPTION_KEY=${TB_BROKER_ENCRYPTION_KEY}" \
              "TB_POSTGRES_PASSWORD=${TB_POSTGRES_PASSWORD}" \
              "TB_POSTGRES_USER=tradingbot" \
              "TB_POSTGRES_DB=tradingbot" \
              "TB_GROQ_API_KEY=${TB_GROQ_API_KEY}" > "${DEPLOY_DIR}/.env"
            chmod 600 "${DEPLOY_DIR}/.env"

            # Disk hygiene: prune ONLY stopped containers and dangling images (preserve base layers for fast cache!)
            docker container prune -f 2>/dev/null || true
            docker image prune -f 2>/dev/null || true
            sudo journalctl --vacuum-time=1d 2>/dev/null || true

            # If disk usage > 85%, run targeted prune on images older than 48h
            DISK_PCT=$(df / | awk 'NR==2 {print $5}' | tr -d '%')
            if [ "${DISK_PCT}" -gt 85 ]; then
              echo "Disk usage high (${DISK_PCT}%) — cleaning older unused images"
              docker image prune -af --filter "until=48h" 2>/dev/null || true
            fi

            echo "=== Logging in to GHCR ==="
            retry 4 8 bash -c 'echo "${GH_TOKEN}" | docker login ghcr.io -u "${GH_ACTOR}" --password-stdin'

            echo "=== Pulling updated images (layer cache preserved) ==="
            if [ "${BUILD_BACKEND}" = "true" ] || [ ! "$(docker images -q tradingbot-backend:latest 2>/dev/null)" ]; then
              echo "Pulling backend image..."
              retry 4 10 docker pull "${BACKEND_IMAGE}:latest"
              docker tag "${BACKEND_IMAGE}:latest" tradingbot-backend:latest
            else
              echo "Backend unchanged — reusing current image."
            fi

            if [ "${BUILD_FRONTEND}" = "true" ] || [ ! "$(docker images -q tradingbot-frontend:latest 2>/dev/null)" ]; then
              echo "Pulling frontend image..."
              retry 4 10 docker pull "${FRONTEND_IMAGE}:latest"
              docker tag "${FRONTEND_IMAGE}:latest" tradingbot-frontend:latest
            else
              echo "Frontend unchanged — reusing current image."
            fi

            echo "=== Starting DB & Redis if needed ==="
            docker compose -p tradingbot \
              -f docker-compose.tradingbot.yml \
              --env-file .env \
              up -d tradingbot-pg tradingbot-redis

            # Fast sync of DB password
            for pgi in $(seq 1 10); do
              if docker compose -p tradingbot -f docker-compose.tradingbot.yml exec -T tradingbot-pg pg_isready -U tradingbot 2>/dev/null; then
                docker compose -p tradingbot -f docker-compose.tradingbot.yml exec -T tradingbot-pg \
                  psql -U tradingbot -d tradingbot -c "ALTER USER tradingbot WITH PASSWORD '${TB_POSTGRES_PASSWORD}';" 2>/dev/null || true
                break
              fi
              sleep 1
            done

            echo "=== Updating TradingBot stack (hive-* stacks untouched) ==="
            docker compose -p tradingbot \
              -f docker-compose.tradingbot.yml \
              --env-file .env \
              up -d --no-build

            echo "=== Fast health check probe ==="
            HEALTHY=0
            for i in $(seq 1 30); do
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8003/api/health 2>/dev/null || echo "000")
              if [ "${HTTP_CODE}" = "200" ]; then
                echo "Backend healthy! Responded HTTP 200 in ~ $((i * 2))s!"
                HEALTHY=1; break
              fi
              sleep 2
            done

            if [ "${HEALTHY}" -eq 0 ]; then
              echo "ERROR: Backend health check failed. Recent logs:"
              docker logs tradingbot-backend --tail 50 2>&1
              exit 1
            fi

            # ── Optional DB migration ───────────────────────────────────────
            if [ "${RUN_DB_MIGRATION}" = "true" ]; then
              echo "=== Running DB migration ==="
              if [ ! -f scripts/db_migrate.sh ] || [ ! -f tradingbot.sql ]; then
                echo "ERROR: migration assets missing on server."
                exit 1
              fi
              FORCE_YES=1 bash scripts/db_migrate.sh
              docker restart tradingbot-backend >/dev/null 2>&1 || true
            fi

            echo "=== Installing Nginx config ==="
            sudo cp deploy/nginx/tradingbot.conf /etc/nginx/conf.d/tradingbot.conf

            if sudo nginx -t 2>&1; then
              sudo systemctl reload nginx
              echo "Nginx reloaded!"
            fi

            echo ""
            echo "=== Deployment complete! ==="
            docker ps --format "table {{.Names}}\t{{.Ports}}\t{{.Status}}" | grep -E "tradingbot|hive"

            # Background cleanup of old dangling layers
            docker image prune -f >/dev/null 2>&1 &
