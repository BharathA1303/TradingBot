<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 50" fill="none">
  <defs>
    <linearGradient id="tb-box-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="tb-accent-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="60%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="tb-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#06b6d4" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Icon at x=5, y=5, size=40 -->
  <g transform="translate(5, 5)">
    <rect x="2" y="2" width="36" height="36" rx="9" fill="url(#tb-box-grad)" stroke="url(#tb-accent-grad)" stroke-width="1.5" />
    <rect x="10" y="20" width="3" height="10" rx="1" fill="#10b981" opacity="0.85" />
    <line x1="11.5" y1="17" x2="11.5" y2="33" stroke="#10b981" stroke-width="1" stroke-linecap="round" opacity="0.6" />
    <rect x="17" y="14" width="3.2" height="16" rx="1" fill="#06b6d4" opacity="0.9" />
    <line x1="18.6" y1="11" x2="18.6" y2="33" stroke="#06b6d4" stroke-width="1" stroke-linecap="round" opacity="0.6" />
    <rect x="24.5" y="8" width="3.2" height="22" rx="1" fill="#38bdf8" />
    <line x1="26.1" y1="5" x2="26.1" y2="33" stroke="#38bdf8" stroke-width="1" stroke-linecap="round" opacity="0.6" />
    <path d="M 7 28 L 15 18 L 22 22 L 32 8" fill="none" stroke="url(#tb-accent-grad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#tb-glow)" />
    <circle cx="32" cy="8" r="2.2" fill="#38bdf8" filter="url(#tb-glow)" />
  </g>

  <!-- Typography -->
  <text x="56" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="800" fill="#ffffff" letter-spacing="-0.5px">Trading<tspan fill="url(#tb-accent-grad)">Bot</tspan></text>
  
  <!-- Pill Badge -->
  <rect x="175" y="19" width="38" height="16" rx="4" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1" />
  <text x="194" y="30.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#10b981" text-anchor="middle" letter-spacing="0.5px">PRO</text>
</svg>
