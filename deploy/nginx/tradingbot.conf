# ============================================================
#  Nginx Reverse Proxy — TradingBot on AWS EC2
#  Server  : 3.7.55.85 (Amazon Linux 2023)
#
#  Traffic flow:
#    Client → Nginx (80)
#      → Frontend container (127.0.0.1:3003)
#        → /api, /ws, /uploads proxied to Backend (127.0.0.1:8003)
#
#  Place this file at:  /etc/nginx/conf.d/tradingbot.conf
#  Then run:            sudo nginx -t && sudo systemctl reload nginx
# ============================================================

# ── Rate limiting ─────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=tradingbot_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=tradingbot_auth:10m    rate=5r/m;

# ── Upstream backends ─────────────────────────────────────────
upstream tradingbot_frontend {
    server 127.0.0.1:3003;
    keepalive 16;
}

upstream tradingbot_backend {
    server 127.0.0.1:8003;
    keepalive 8;
}

# ── Main HTTP server (port 80 — no domain/SSL yet) ───────────
server {
    listen 80;
    listen [::]:80;
    server_name 3.7.55.85 _;

    # ── Security headers ──────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff" always;
    add_header X-Frame-Options         "SAMEORIGIN" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # ── Gzip ──────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain text/css text/javascript
        application/json application/javascript
        application/xml image/svg+xml;

    # ── Logging ───────────────────────────────────────────────
    access_log /var/log/nginx/tradingbot-access.log;
    error_log  /var/log/nginx/tradingbot-error.log;

    # ── Client limits ─────────────────────────────────────────
    client_max_body_size 10M;

    # ── API routes (direct to backend, bypass frontend nginx) ─
    location /api/ {
        limit_req zone=tradingbot_general burst=50 nodelay;

        proxy_pass http://tradingbot_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout  120s;
        proxy_send_timeout  120s;
        proxy_connect_timeout 10s;
    }

    # ── Auth endpoints (stricter rate limit) ──────────────────
    location /api/auth/ {
        limit_req zone=tradingbot_auth burst=5 nodelay;

        proxy_pass http://tradingbot_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout  30s;
    }

    # ── WebSocket (direct to backend) ─────────────────────────
    location /ws/ {
        proxy_pass http://tradingbot_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
    }

    # ── Uploads (direct to backend) ───────────────────────────
    location /uploads/ {
        proxy_pass http://tradingbot_backend;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── Frontend (everything else) ────────────────────────────
    location / {
        limit_req zone=tradingbot_general burst=50 nodelay;

        proxy_pass http://tradingbot_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout  30s;
    }

    # ── Health checks (no rate limit) ─────────────────────────
    location = /api/health {
        proxy_pass http://tradingbot_backend;
        access_log off;
    }
}

