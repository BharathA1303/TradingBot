# ============================================================================
#  TradingBot Real — Production Docker Compose
#  Deploy path : /opt/apps/TradingBot-real
#  Domain      : demo.TradingBot.app
#  Project     : TradingBot-real   (explicit — never autogenerated)
#
#  ISOLATION CONTRACT (multi-app server /opt/apps):
#    - Own project ....... TradingBot-real
#    - Own network ....... TradingBot-real-network
#    - Own volumes ....... TradingBot-real-{pgdata,redis,uploads}
#    - Own containers .... TradingBot-real-{frontend,backend,postgres,redis}
#    - Postgres & Redis are INTERNAL ONLY (no host port)
#    - Only 127.0.0.1:3001 (frontend) and 127.0.0.1:8001 (backend) published
#
#  Touches NOTHING belonging to any other application on the server.
# ============================================================================

name: TradingBot-real

services:
  # ── Frontend (React build → container-internal nginx) ─────────────────────
  frontend:
    build:
      context: ./frontend
      args:
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
    image: TradingBot-real-frontend:latest
    container_name: TradingBot-real-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - TradingBot-real-network

  # ── Backend (FastAPI + Gunicorn/Uvicorn) ──────────────────────────────────
  backend:
    build:
      context: ./backend
    image: TradingBot-real-backend:latest
    container_name: TradingBot-real-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8000"
    env_file:
      - .env
    environment:
      # Wire to THIS stack's internal services. Secrets come from .env only.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      FIREBASE_CREDENTIALS_PATH: /app/firebase-credentials.json
    volumes:
      - TradingBot-real-uploads:/app/uploads
      - ./firebase-credentials.json:/app/firebase-credentials.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 90s
    networks:
      - TradingBot-real-network

  # ── PostgreSQL (INTERNAL ONLY — no host port) ─────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: TradingBot-real-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - TradingBot-real-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - TradingBot-real-network

  # ── Redis (INTERNAL ONLY — no host port) ──────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: TradingBot-real-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save ""
    volumes:
      - TradingBot-real-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - TradingBot-real-network

# ── Dedicated bridge network (owned solely by this app) ─────────────────────
networks:
  TradingBot-real-network:
    name: TradingBot-real-network
    driver: bridge

# ── Named volumes (explicit — never anonymous/autogenerated) ────────────────
volumes:
  TradingBot-real-pgdata:
    name: TradingBot-real-pgdata
  TradingBot-real-redis:
    name: TradingBot-real-redis
  TradingBot-real-uploads:
    name: TradingBot-real-uploads
